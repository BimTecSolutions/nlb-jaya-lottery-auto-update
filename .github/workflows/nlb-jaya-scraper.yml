name: NLB Jaya Incremental Scraper

on:
  schedule:
    # Runs every 5 minutes. GitHub may delay this slightly under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome + matching ChromeDriver
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-chromedriver: true

      - name: Verify Chrome/ChromeDriver versions
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          echo "ChromeDriver path: ${{ steps.setup-chrome.outputs.chromedriver-path }}"
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version

      - name: Run incremental scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MAIN_COLLECTION: NLB_Results_All
          SUB_COLLECTION: NLB_Jaya
          MAX_NEW_DRAWS: "10"
          USE_SELENIUM: "true"
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: python nlb_jaya_incremental.py
